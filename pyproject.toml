[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xasbind"
version = "0.1.0"
description = "ImageBind-style multimodal model for crystal structure, XANES, and EXAFS."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "h5py>=3.8",
    "scikit-learn>=1.3",
    "tqdm>=4.65",
    "pymatgen>=2024.1",
    "torch>=2.1",
    "mp-api>=0.39",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
